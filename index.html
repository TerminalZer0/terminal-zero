  <script>
    var serviceWorkerVersion = '2792502507';
    var scriptLoaded = false;
    function loadMainDartJs() {
      if (scriptLoaded) {
        return;
      }
      scriptLoaded = true;
      var scriptTag = document.createElement("script");
      scriptTag.src = "main.dart.js";
      scriptTag.type = "application/javascript";
      document.body.append(scriptTag);
    }

    if ("serviceWorker" in navigator) {
      // Service workers are supported. Use them.
      window.addEventListener("load", function () {
        // Wait for registration to finish before dropping the <script> tag.
        // Otherwise, the browser will load the script multiple times,
        // potentially different versions.
        var serviceWorkerUrl =
          "flutter_service_worker.js?v=" + serviceWorkerVersion;
        navigator.serviceWorker.register(serviceWorkerUrl).then((reg) => {
          function waitForActivation(serviceWorker) {
            serviceWorker.addEventListener("statechange", () => {
              if (serviceWorker.state == "activated") {
                console.log("Installed new service worker.");
                loadMainDartJs();
              }
            });
          }
          if (!reg.active && (reg.installing || reg.waiting)) {
            // No active web worker and we have installed or are installing
            // one for the first time. Simply wait for it to activate.
            waitForActivation(reg.installing ?? reg.waiting);
          } else if (!reg.active.scriptURL.endsWith(serviceWorkerVersion)) {
            // When the app updates the serviceWorkerVersion changes, so we
            // need to ask the service worker to update.
            console.log("New service worker available.");
            reg.update();
            waitForActivation(reg.installing);
          } else {
            // Existing service worker is still good.
            console.log("Loading app from service worker.");
            loadMainDartJs();
          }
        });

        // If service worker doesn't succeed in a reasonable amount of time,
        // fallback to plaint <script> tag.
        setTimeout(() => {
          if (!scriptLoaded) {
            console.warn(
              "Failed to load app from service worker. Falling back to plain <script> tag."
            );
            loadMainDartJs();
          }
        }, 4000);
      });
    } else {
      // Service workers not supported. Just drop the <script> tag.
      loadMainDartJs();
    }

  <!-- ===================== TERMINAL ZERO: fala da assassina ao entrar =====================
       As falas ficam em falas.txt (uma por linha).
       "Rara:" no começo  -> aparece com menos frequência.
       "Mestre:" no começo -> aparece só quando o mestre entra.
       **texto** fica em destaque (vermelho). -->
  <style>
    @font-face { font-family: "TZCorpo"; src: url("assets/lib/assets/tz_corpo.ttf"); }
    @font-face { font-family: "TZTitulo"; src: url("assets/lib/assets/tz_bates.ttf"); }
    #tz-fala {
      position: fixed; inset: 0; z-index: 2147483647; overflow: hidden;
      display: flex; align-items: center; justify-content: center; padding: 24px;
      background: #000; color: #e7ddc1; font-family: "TZCorpo", "Oswald", sans-serif; cursor: default;
      transition: opacity .8s ease;
    }
    #tz-fala.tz-saindo { opacity: 0; }
    #tz-fala > * { pointer-events: none; }

    /* 2) chiado VHS */
    #tz-fala .tz-ruido {
      position: absolute; inset: 0; width: 100%; height: 100%; image-rendering: pixelated;
      opacity: 0; mix-blend-mode: screen;
    }
    #tz-fala.f-ruido .tz-ruido { animation: tz-chiado .8s ease-in-out forwards; }
    #tz-fala .tz-linhas {
      position: absolute; inset: 0; opacity: 0;
      background: repeating-linear-gradient(to bottom, rgba(0,0,0,.55) 0 2px, transparent 2px 4px);
    }
    #tz-fala.f-ruido .tz-linhas { opacity: 1; }
    #tz-fala .tz-rasgo {
      position: absolute; left: 0; right: 0; height: 9%; top: 30%; opacity: 0;
      background: linear-gradient(to right, transparent, rgba(231,221,193,.35), rgba(212,2,0,.45), transparent);
    }
    #tz-fala.f-ruido .tz-rasgo { animation: tz-rasgo .75s steps(1) forwards; }

    /* 3) batidas de coração */
    #tz-fala .tz-pulso {
      position: absolute; inset: -10%; opacity: 0;
      background: radial-gradient(ellipse at center, transparent 35%, rgba(145,18,26,.85) 75%, rgba(60,0,4,1) 100%);
    }
    #tz-fala.f-pulso .tz-pulso { animation: tz-batida 1.1s ease-out forwards; }

    /* fundo final */
    #tz-fala .tz-fundo {
      position: absolute; inset: 0; opacity: 0; transition: opacity 1.2s ease;
      background: radial-gradient(ellipse at center, rgba(40,4,6,.9) 0%, rgba(4,1,1,1) 70%);
    }
    #tz-fala.f-rotulo .tz-fundo { opacity: 1; }

    /* 4) rótulo e 5) fala */
    #tz-fala .tz-caixa { position: relative; max-width: 900px; text-align: center; }
    #tz-fala .tz-rotulo {
      font-family: "TZTitulo", "TZCorpo", sans-serif; color: #b3161c; font-size: clamp(22px, 3vw, 34px);
      letter-spacing: .08em; text-transform: uppercase; text-shadow: 3px 3px 0 #000; margin-bottom: 28px;
      opacity: 0;
    }
    #tz-fala.f-rotulo .tz-rotulo { animation: tz-lampada .9s linear forwards; }
    #tz-fala .tz-texto {
      font-size: clamp(22px, 3.2vw, 40px); line-height: 1.35; font-weight: 300;
      text-shadow: 0 0 18px rgba(145,18,26,.55), 2px 2px 0 #000;
    }
    #tz-fala .tz-texto strong { color: #d40200; font-weight: 600; }
    #tz-fala .tz-texto span { opacity: 0; animation: tz-letra .05s forwards; }
    #tz-fala:not(.f-texto) .tz-texto span { animation-play-state: paused; } /* espaço reservado, letras esperando */
    #tz-fala.tz-rara .tz-texto { animation: tz-tremor 3s infinite; }
    #tz-fala.tz-rara .tz-rotulo { color: #d40200; }

    @keyframes tz-chiado {
      0% { opacity: 0; } 20% { opacity: .75; } 70% { opacity: .6; } 100% { opacity: 0; }
    }
    @keyframes tz-rasgo {
      0% { opacity: 0; top: 70%; } 15% { opacity: 1; top: 18%; } 30% { opacity: 0; }
      45% { opacity: 1; top: 55%; height: 4%; } 60% { opacity: 0; } 75% { opacity: .8; top: 82%; } 100% { opacity: 0; }
    }
    @keyframes tz-batida {
      0% { opacity: 0; transform: scale(1.08); } 8% { opacity: 1; transform: scale(1); } 28% { opacity: .1; }
      38% { opacity: .75; transform: scale(1.02); } 60% { opacity: 0; } 100% { opacity: 0; }
    }
    @keyframes tz-lampada {
      0% { opacity: 0; } 8% { opacity: 1; } 12% { opacity: 0; } 30% { opacity: 0; } 34% { opacity: .8; }
      40% { opacity: .1; } 52% { opacity: 1; } 56% { opacity: .3; } 62% { opacity: 1; } 100% { opacity: 1; }
    }
    @keyframes tz-letra { to { opacity: 1; } }
    @keyframes tz-tremor {
      0%, 92%, 100% { transform: none; filter: none; }
      93% { transform: translate(2px,-1px); filter: blur(.6px); }
      95% { transform: translate(-2px,1px); }
      97% { transform: translate(1px,1px); filter: blur(.4px); }
    }
    #tz-fala.tz-reduzido .tz-ruido, #tz-fala.tz-reduzido .tz-linhas, #tz-fala.tz-reduzido .tz-rasgo, #tz-fala.tz-reduzido .tz-pulso { display: none; }
    #tz-fala.tz-reduzido.f-rotulo .tz-rotulo { animation: none; opacity: 1; }
    #tz-fala.tz-reduzido .tz-texto span { animation: none; opacity: 1; }
    #tz-fala.tz-reduzido.tz-rara .tz-texto { animation: none; }
  </style>
  <script>
    (function () {
      var PESO_NORMAL = 1;
      var PESO_RARA = 0.25;   // quanto menor, mais rara (0.25 = 4x menos que uma fala normal)
      var VELOCIDADE_MS = 35; // tempo entre cada letra
      // linha do tempo da entrada (milissegundos desde o login)
      var T_RUIDO = 180, T_PULSO = 1250, T_ROTULO = 2450, T_TEXTO = 3300;
      // true = quem desligou as animações do sistema vê a fala direto, sem a entrada
      var RESPEITAR_REDUZIR_MOVIMENTO = false;

      function lerFalas(texto) {
        return texto.replace(/^﻿/, "").split(/\r?\n/).map(function (l) { return l.trim(); })
          .filter(function (l) { return l.length > 0; })
          .map(function (l) {
            var m;
            if ((m = l.match(/^mestre\s*:\s*/i))) return { texto: l.slice(m[0].length), tipo: "mestre" };
            if ((m = l.match(/^rar[ao]\s*:\s*/i))) return { texto: l.slice(m[0].length), tipo: "rara" };
            return { texto: l, tipo: "normal" };
          });
      }

      function sortear(falas, mestre) {
        var pool = falas.filter(function (f) { return mestre ? f.tipo === "mestre" : f.tipo !== "mestre"; });
        if (mestre && pool.length === 0) pool = falas.filter(function (f) { return f.tipo !== "mestre"; });
        if (pool.length === 0) return null;
        var total = 0, pesos = pool.map(function (f) { var p = f.tipo === "rara" ? PESO_RARA : PESO_NORMAL; total += p; return p; });
        var x = Math.random() * total;
        for (var i = 0; i < pool.length; i++) { x -= pesos[i]; if (x < 0) return pool[i]; }
        return pool[pool.length - 1];
      }

      function montarTexto(el, texto, instantaneo) {
        // **destaque** -> <strong>; cada letra vira um <span> para o efeito de digitação
        el.textContent = "";
        var partes = texto.split(/(\*\*[^*]+\*\*)/), atraso = 0;
        partes.forEach(function (parte) {
          if (!parte) return;
          var destaque = /^\*\*[^*]+\*\*$/.test(parte), alvo = el;
          if (destaque) { parte = parte.slice(2, -2); alvo = document.createElement("strong"); el.appendChild(alvo); }
          Array.from(parte).forEach(function (ch) {
            var s = document.createElement("span");
            s.textContent = ch;
            if (instantaneo) { s.style.animation = "none"; s.style.opacity = "1"; }
            else { s.style.animationDelay = atraso + "ms"; atraso += VELOCIDADE_MS; }
            alvo.appendChild(s);
          });
        });
      }

      function chiado(canvas) {
        // estática de fita: ruído em baixa resolução, levemente avermelhado
        var w = 192, h = 108, ctx = canvas.getContext("2d"), parar = false;
        canvas.width = w; canvas.height = h;
        var img = ctx.createImageData(w, h), d = img.data;
        (function quadro() {
          if (parar) return;
          for (var i = 0; i < d.length; i += 4) {
            var v = Math.random() * 255 | 0;
            d[i] = Math.min(255, v + 25); d[i + 1] = v * 0.82 | 0; d[i + 2] = v * 0.78 | 0; d[i + 3] = 255;
          }
          ctx.putImageData(img, 0, 0);
          requestAnimationFrame(quadro);
        })();
        return function () { parar = true; };
      }

      window.tzMostrarFala = function (mestre) {
        fetch("falas.txt", { cache: "no-store" })
          .then(function (r) { if (!r.ok) throw new Error(r.status); return r.text(); })
          .then(function (txt) {
            var fala = sortear(lerFalas(txt), !!mestre);
            if (!fala || document.getElementById("tz-fala")) return;
            var reduzido = RESPEITAR_REDUZIR_MOVIMENTO && window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
            var box = document.createElement("div");
            box.id = "tz-fala";
            if (fala.tipo === "rara") box.classList.add("tz-rara");
            if (reduzido) box.classList.add("tz-reduzido");
            box.innerHTML = '<canvas class="tz-ruido"></canvas><div class="tz-linhas"></div><div class="tz-rasgo"></div>' +
              '<div class="tz-pulso"></div><div class="tz-fundo"></div>' +
              '<div class="tz-caixa"><div class="tz-rotulo"></div><div class="tz-texto"></div></div>';
            box.querySelector(".tz-rotulo").textContent = mestre ? "Tudo pronto, mestre." : "Ele te viu chegar.";
            var texto = box.querySelector(".tz-texto");
            montarTexto(texto, fala.texto, false);   // já ocupa o espaço, para nada pular de lugar
            document.body.appendChild(box);

            var timers = [], pararChiado = null, fase = "intro";
            var depois = function (ms, fn) { timers.push(setTimeout(fn, ms)); };
            var mostrarTudo = function (instantaneo) {
              timers.forEach(clearTimeout); timers = [];
              if (pararChiado) { pararChiado(); pararChiado = null; }
              box.classList.remove("f-ruido", "f-pulso");
              box.classList.add("f-rotulo", "f-texto");
              montarTexto(texto, fala.texto, instantaneo);
              fase = "fala";
            };

            if (reduzido) {
              mostrarTudo(true);
            } else {
              depois(T_RUIDO, function () { pararChiado = chiado(box.querySelector(".tz-ruido")); box.classList.add("f-ruido"); });
              depois(T_RUIDO + 800, function () { if (pararChiado) { pararChiado(); pararChiado = null; } box.classList.remove("f-ruido"); });
              depois(T_PULSO, function () { box.classList.add("f-pulso"); });
              depois(T_ROTULO, function () { box.classList.add("f-rotulo"); });
              depois(T_TEXTO, function () { box.classList.add("f-texto"); fase = "fala"; timers = []; });
            }

            var fechar = function () {
              document.removeEventListener("keydown", tecla, true);
              box.classList.add("tz-saindo");
              setTimeout(function () { box.remove(); }, 800);
            };
            var avancar = function (ev) {
              if (ev) { ev.preventDefault(); ev.stopPropagation(); }
              if (fase === "intro") mostrarTudo(true);   // 1º clique durante a entrada: pula para a fala
              else fechar();
            };
            var tecla = function (ev) { if (ev.key === "Escape" || ev.key === "Enter" || ev.key === " ") avancar(ev); };
            ["pointerdown", "pointerup", "mousedown", "mouseup", "touchstart", "touchend", "wheel"].forEach(function (t) {
              box.addEventListener(t, function (ev) { ev.stopPropagation(); }, true);
            });
            box.addEventListener("click", avancar);
            document.addEventListener("keydown", tecla, true);
          })
          .catch(function (e) { console.warn("Terminal Zero: não consegui ler falas.txt", e); });
      };
    })();
  </script>
